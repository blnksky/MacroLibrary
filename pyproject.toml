[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "MacroLibrary"
dynamic = ["version"]
dependencies = [
    "requests>=2.31.0",
    "pygetwindow; sys_platform == 'win32'",
    "python-xlib; sys_platform == 'linux'",
    "evdev; sys_platform == 'linux'",
]

[tool.setuptools_scm]
[tool.setuptools.packages.find]